name: Android test APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Do not let two builds race to create different test signing keys.
concurrency:
  group: ducks-disorder-android-signing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack real collectible PNG artwork
        run: |
          unzip -oq assets/office-collectibles-v1.zip -d .
          test -s app/src/main/assets/collectibles/ask_axel_mug.png
          test -s app/src/main/assets/collectibles/mira_middle_finger.png
      - name: Smoke test packing and rewards
        run: node tests/smoke.cjs

      - name: Restore persistent test signing key
        id: signing-key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/ducks-disorder-debug.keystore
          key: ducks-disorder-android-debug-signing-v2

      # This creates the signing key once, on the first build using this
      # workflow. Subsequent builds restore that SAME key from Actions cache.
      - name: Initialize signing key when missing
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/ducks-disorder-debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 3072 \
            -validity 36500 \
            -dname "CN=Ducks and Disorder Debug, O=Creative Pixels, C=CA"

      - name: Validate signing key and pin certificate
        run: |
          KEY="$HOME/.android/ducks-disorder-debug.keystore"
          test -s "$KEY" || { echo "::error::Missing APK signing key"; exit 1; }
          keytool -list -keystore "$KEY" -storepass android -alias androiddebugkey > /dev/null
          FINGERPRINT="$(keytool -exportcert -alias androiddebugkey -keystore "$KEY" -storepass android | sha256sum | cut -d' ' -f1)"
          echo "APK signing certificate sha256: $FINGERPRINT"
          if test -f signing/ci-debug-cert.sha256; then
            EXPECTED="$(tr -d '\n\r ' < signing/ci-debug-cert.sha256)"
            if test "$FINGERPRINT" != "$EXPECTED"; then
              echo "::error::Signing key changed! Refusing to build an APK that would force an uninstall."
              exit 1
            fi
          else
            echo "::notice::First signing-key bootstrap. Pin this fingerprint in signing/ci-debug-cert.sha256 after success."
          fi

      # Save immediately, before Gradle or release publishing can fail.
      - name: Save new persistent signing key
        if: steps.signing-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/ducks-disorder-debug.keystore
          key: ducks-disorder-android-debug-signing-v2

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ducks-disorder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish stable direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ducks-disorder-test-latest >/dev/null 2>&1; then
            gh release create ducks-disorder-test-latest --target "$GITHUB_SHA" --title "Ducks & Disorder - Latest Test APK" --notes "Latest debug Android APK for testing only. Not a Play Store release." --prerelease
          fi
          gh release upload ducks-disorder-test-latest app/build/outputs/apk/debug/app-debug.apk --clobber
