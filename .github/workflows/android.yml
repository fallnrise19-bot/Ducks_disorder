name: Android test APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Smoke test packing and rewards
        run: node tests/smoke.cjs
      - name: Retain test APK signing key across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ducks-disorder-debug-keystore-v1
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ducks-disorder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish stable direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view ducks-disorder-test-latest >/dev/null 2>&1; then
            gh release create ducks-disorder-test-latest --target "$GITHUB_SHA" --title "Ducks & Disorder - Latest Test APK" --notes "Latest debug Android APK for testing only. Not a Play Store release." --prerelease
          fi
          gh release upload ducks-disorder-test-latest app/build/outputs/apk/debug/app-debug.apk --clobber